<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vulnerable Login (DO NOT USE IN PRODUCTION)</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 4rem auto; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.5rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Login</h1>

  <!--
    THIS FILE IS DELIBERATELY INSECURE.
    It exists only so Part 3 of the assignment has a real bug to exploit
    and document. Do not reuse this pattern anywhere else.

    Bug: the "welcome" message below is built by concatenating the raw
    email input into an HTML string and injecting it with innerHTML.
    Nothing escapes it, so whatever the user types is parsed as markup —
    classic reflected XSS. No backend/SQL is involved here since this demo
    has no database, so the SQLi half of Part 1/3 is covered conceptually
    against Juice Shop itself instead (which does have a real backend).
  -->

  <form id="vuln-form">
    <label>Email <input type="text" id="vuln-email" /></label>
    <label>Password <input type="password" id="vuln-password" /></label>
    <button type="submit">Log in</button>
  </form>

  <div id="welcome"></div>

  <script>
    document.getElementById("vuln-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("vuln-email").value;

      // VULNERABLE: untrusted input concatenated straight into innerHTML.
      // Try entering:  <img src=x onerror=alert('XSS')>
      document.getElementById("welcome").innerHTML = "Welcome, " + email + "!";
    });
  </script>
</body>
</html>
